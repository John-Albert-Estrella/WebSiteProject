<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aimser - Admin Control Panel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-brand">
      <h2>Aimser</h2>
      <p>Admin Portal</p>
    </div>
    <nav class="sidebar-nav">
      <a href="admin.html" class="nav-item active"><span>🛡️</span> User Management</a>
    </nav>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div>
        <span id="header-user-name" style="font-weight: 600;">Admin</span>
        <span id="header-user-role" class="status-badge status-pending" style="margin-left: 8px;">ADMIN</span>
      </div>
      <button id="btn-logout" class="btn btn-reject">Log Out</button>
    </header>

    <div class="page-container">
      <div class="page-header">
        <h1 class="page-title">System User Directory</h1>
        <p class="page-subtitle">Monitor and control active accounts across students, faculty, and staff.</p>
      </div>

      <div class="analytics-grid">
        <div class="metric-card">
          <span class="title">Total Users</span>
          <span class="value" id="count-total">0</span>
        </div>
        <div class="metric-card">
          <span class="title">Students</span>
          <span class="value" id="count-students">0</span>
        </div>
        <div class="metric-card">
          <span class="title">Faculty Members</span>
          <span class="value" id="count-faculty">0</span>
        </div>
      </div>

      <div class="card">
        <table class="data-table">
          <thead>
            <tr>
              <th>Full Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Enrolled Room</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-table-body">
            <tr><td colspan="5" style="text-align:center;">Loading records...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module" src="js/admin.js"></script>
  <script type="module" src="js/auth-guard.js"></script>
</body>
</html>
