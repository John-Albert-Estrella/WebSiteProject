<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EARIST Class Monitor — Attendance Record</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-badge">EARIST</div>
        <h3 class="brand-title">Class Monitor</h3>
      </div>

      <nav class="sidebar-menu">
        <button class="nav-btn" data-page="index.html"><span class="icon">📊</span> Dashboard</button>
        <button class="nav-btn" data-page="attendance.html"><span class="icon">📋</span> Attendance Roll Call</button>
        <button class="nav-btn" data-page="groupings.html"><span class="icon">👥</span> Groupings Selection</button>
        <button class="nav-btn" data-page="roulette.html"><span class="icon">🎰</span> Student Roulette</button>
        <button class="nav-btn" data-page="polls.html"><span class="icon">🗳️</span> Live Polls</button>
        <button class="nav-btn" data-page="file-vault.html"><span class="icon">📁</span> File Vault</button>
        <button class="nav-btn" data-page="calendar.html"><span class="icon">📅</span> Events Calendar</button>
      </nav>

      <div class="sidebar-footer">
        <div class="code-box">
          <span class="code-label">CLASS CODE</span>
          <span class="code-value">---</span>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-nav">
        <div>
          <h1 class="page-title">Attendance Record & Roll Call</h1>
          <p class="sub-title">Track student presence, lates, and absences</p>
        </div>
        <div class="top-nav-controls">
          <button id="theme-toggle" class="theme-toggle-btn">🌙 Dark Mode</button>
          <button id="export-csv-btn" class="btn btn-maroon">+ Export CSV</button>
        </div>
      </header>

      <div class="dashboard-grid">
        <section class="card card-gold span-3">
          <div class="card-header">
            <h3>Active Session Summary</h3>
            <span class="pill-tag tag-dark">Today</span>
          </div>
          <div class="info-stats-grid">
            <div class="stat-box"><span id="count-present" class="stat-num">0</span><span class="stat-label">Present</span></div>
            <div class="stat-box"><span id="count-late" class="stat-num">0</span><span class="stat-label">Late</span></div>
            <div class="stat-box"><span id="count-absent" class="stat-num">0</span><span class="stat-label">Absent</span></div>
          </div>
        </section>

        <section class="card span-3">
          <div class="card-header">
            <h3>Student Roster</h3>
            <span id="roster-class-tag" class="pill-tag tag-maroon">Class List</span>
          </div>

          <div id="attendance-roster-container" class="student-status-list">
            <p class="sub-title" style="text-align: center; padding: 20px;">No students enrolled or joined yet.</p>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="js/sidebar.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/class-manager.js"></script>
  <script src="js/attendance.js"></script>
</body>
</html>
