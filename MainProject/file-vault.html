<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EARIST Class Monitor — File Vault</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-badge">EARIST</div>
        <h3 class="brand-title">Class Monitor</h3>
      </div>

      <nav class="sidebar-menu">
        <button class="nav-btn" data-page="index.html"><span class="icon">📊</span> Dashboard</button>
        <button class="nav-btn" data-page="attendance.html"><span class="icon">📋</span> Attendance Roll Call</button>
        <button class="nav-btn" data-page="groupings.html"><span class="icon">👥</span> Groupings Selection</button>
        <button class="nav-btn" data-page="roulette.html"><span class="icon">🎰</span> Student Roulette</button>
        <button class="nav-btn" data-page="polls.html"><span class="icon">🗳️</span> Live Polls</button>
        <button class="nav-btn" data-page="file-vault.html"><span class="icon">📁</span> File Vault</button>
        <button class="nav-btn" data-page="calendar.html"><span class="icon">📅</span> Events Calendar</button>
      </nav>

      <div class="sidebar-footer">
        <div class="code-box">
          <span class="code-label">CLASS CODE</span>
          <span class="code-value">---</span>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-nav">
        <div>
          <h1 class="page-title">Course Materials & File Vault</h1>
          <p class="sub-title">Upload and download syllabus, lecture slides, and assignment guides</p>
        </div>
        <div class="top-nav-controls">
          <button id="theme-toggle" class="theme-toggle-btn">🌙 Dark Mode</button>
        </div>
      </header>

      <section class="card upload-dropzone">
        <h3>Upload Learning Documents</h3>
        <p class="sub-title">Supports PDF, PPT, PPTX, DOC, and DOCX files</p>
        <input type="file" id="file-upload-input" multiple accept=".pdf,.ppt,.pptx,.doc,.docx" style="margin-top: 12px;">
      </section>

      <div id="file-repository-grid" class="file-grid">
        <p class="sub-title" style="text-align: center; grid-column: span 3; padding: 20px;">No files uploaded yet. Choose files above to populate the repository.</p>
      </div>
    </main>
  </div>

  <script src="js/sidebar.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/class-manager.js"></script>
  <script src="js/file-vault.js"></script>
</body>
</html>
