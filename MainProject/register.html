<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EARIST Class Monitor — Register</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <div class="auth-layout">
    <div class="card auth-card">
      
      <div class="auth-header">
        <span class="brand-badge">EARIST</span>
        <h2>Class Monitor</h2>
        <p class="sub-title">Sign up or sign in using your Google account</p>
      </div>

      <div class="auth-body">
        
        <!-- Google OAuth Initialization with your generated Client ID -->
        <div id="g_id_onload"
             data-client_id="599238441472-vvr7ho1dk0dec8p12h6ktbiabmsbk7cd.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>

        <div class="g_id_signin" 
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="continue_with"
             data-shape="rectangular">
        </div>

        <div class="auth-divider">
          <span>OR REGISTER MANUALLY</span>
        </div>

        <form id="manual-register-form" style="width: 100%; display: flex; flex-direction: column; gap: 12px;">
          <div class="form-group">
            <label class="stat-label">Full Name</label>
            <input type="text" id="reg-name" placeholder="Enter full name" required class="btn" style="width: 100%; text-align: left; background: var(--bg-main);">
          </div>

          <div class="form-group">
            <label class="stat-label">I am a:</label>
            <select id="user-role" class="btn" style="width: 100%; text-align: left; background: var(--bg-main);">
              <option value="student">Student</option>
              <option value="professor">Professor / Instructor</option>
            </select>
          </div>

          <button type="submit" class="btn btn-maroon" style="width: 100%; margin-top: 8px;">
            Complete Registration →
          </button>
        </form>

      </div>

      <div class="auth-footer">
        <button id="theme-toggle" class="theme-toggle-btn">🌙 Dark Mode</button>
      </div>

    </div>
  </div>

  <script src="js/sidebar.js"></script>
  <script>
    document.getElementById('manual-register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const role = document.getElementById('user-role').value;

      const userSession = {
        name: name,
        role: role,
        isLoggedIn: true
      };

      localStorage.setItem('earist_user', JSON.stringify(userSession));
      window.location.href = 'index.html';
    });

    function handleCredentialResponse(response) {
      const responsePayload = parseJwt(response.credential);
      const userRole = document.getElementById('user-role').value;

      const userSession = {
        name: responsePayload.name,
        email: responsePayload.email,
        picture: responsePayload.picture,
        role: userRole,
        isLoggedIn: true
      };

      localStorage.setItem('earist_user', JSON.stringify(userSession));
      window.location.href = 'index.html';
    }

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(decodeURIComponent(window.atob(base64).split('').map(c => 
        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
      ).join('')));
    }
  </script>
</body>
</html>
