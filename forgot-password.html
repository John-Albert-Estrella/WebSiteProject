<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aimser - Password Recovery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <img src="assets/aimser-logo.png" alt="Aimser Logo" class="brand-img-badge">
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Enter your institutional email to receive a secure recovery link.</p>
      </div>

      <div id="recovery-alert" class="settings-alert-banner"></div>

      <form id="form-forgot-password" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="reset-email">Institutional Email</label>
          <input 
            type="email" 
            id="reset-email" 
            class="form-control" 
            placeholder="e.g. name@student.mseuf.edu.ph" 
            autocomplete="email"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary auth-submit-btn" id="btn-submit-reset">
          Send Recovery Link to Email
        </button>
      </form>

      <div class="auth-footer">
        Remembered your credentials? <a href="login.html" class="auth-link">Return to Sign In</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/forgot-password.js"></script>
  <script type="module" src="js/theme.js"></script>
</body>
</html>
