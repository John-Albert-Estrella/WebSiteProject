<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark-theme">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIMSER | HR Management Simulator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/loader.css" />
</head>
<body class="loader-body">
  <main class="loader-stage" role="main" aria-live="polite">
    <div class="spinner-chassis">
      <div class="spinner-outer"></div>
      <div class="spinner-inner"></div>
    </div>

    <header class="loader-brand">
      <h1 class="loader-title">AIMSER</h1>
      <span class="loader-sub">HR Simulation Environment</span>
    </header>

    <div class="telemetry-wrapper">
      <div class="telemetry-bar-chassis">
        <div class="telemetry-bar-fill" id="telemetry-fill"></div>
      </div>
      <div class="telemetry-metrics">
        <span class="metric-status" id="telemetry-status">Loading workspace modules...</span>
        <span class="metric-percent" id="telemetry-percent">0%</span>
      </div>
    </div>
  </main>

  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/loader.js"></script>
</body>
</html>
