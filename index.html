<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aimser - Management Simulator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--bg-body);">
  <div style="text-align: center;">
    <img src="assets/aimser-logo.png" alt="Aimser Logo" style="height: 48px; margin-bottom: 16px;">
    <p style="color: var(--text-secondary); font-size: 14px;">Initializing Aimser Workspace...</p>
  </div>

  <script type="module">
    import { auth } from "./js/firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.replace("office.html");
      } else {
        window.location.replace("login.html");
      }
    });
  </script>
</body>
</html>
