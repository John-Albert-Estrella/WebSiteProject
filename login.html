<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | AIMSER HR Simulator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">
  <div class="auth-wrapper">
    <div class="auth-card glass-panel">
      <div class="auth-brand">
        <img src="assets/aimser-logo.png" alt="AIMSER Logo" class="auth-logo" />
        <h1>Welcome Back</h1>
        <p class="text-muted">Sign in to your HR Management Simulator workspace.</p>
      </div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="login-email">Institutional Email</label>
          <input 
            type="email" 
            id="login-email" 
            class="form-control" 
            placeholder="name@institution.edu.ph" 
            required 
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <div>
            <label for="login-password">Password</label>
            <a href="#" id="forgot-password-link" class="text-link">Forgot Password?</a>
          </div>
          <div class="password-input-box">
            <input 
              type="password" 
              id="login-password" 
              class="form-control" 
              placeholder="Enter your password" 
              required 
              autocomplete="current-password"
            />
            <button type="button" class="btn-toggle-pw" id="toggle-login-pw" aria-label="Toggle password visibility">
              <i class="far fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="login-submit-btn" class="btn-primary btn-block">
          Sign In to Simulator
        </button>
      </form>

      <div class="auth-footer">
        <p>Need an account? <a href="register.html" class="text-link">Register here</a></p>
      </div>
    </div>
  </div>

  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/ui-bridge.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
