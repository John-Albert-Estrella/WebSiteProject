<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aimser - Sign In</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <img src="assets/aimser-logo.png" alt="Aimser Logo" class="brand-img-badge">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your HR Management Simulator workspace.</p>
      </div>

      <div id="login-error-box" class="settings-alert-banner danger"></div>

      <form id="form-login" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Institutional Email</label>
          <input 
            type="email" 
            id="login-email" 
            class="form-control" 
            placeholder="e.g. name@mseuf.edu.ph" 
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <div class="form-label-row">
            <label class="form-label" for="login-password">Password</label>
            <a href="forgot-password.html" class="auth-link link-text-sm">Forgot Password?</a>
          </div>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="login-password" 
              class="form-control" 
              placeholder="••••••••" 
              autocomplete="current-password"
              required
            >
            <button type="button" class="btn-toggle-password" data-target="login-password" title="Toggle password visibility" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary auth-submit-btn" id="btn-login-submit">
          Sign In to Simulator
        </button>
      </form>

      <div class="auth-footer">
        Need an account? <a href="register.html" class="auth-link">Register here</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
