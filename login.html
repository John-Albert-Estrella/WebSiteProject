<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aimser - Sign In</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <div class="card auth-card">
      
      <!-- Brand & Header -->
      <div class="auth-header">
        <img src="assets/aimser-logo.png" alt="Aimser Logo" class="brand-img-badge">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign into your HR Management Simulator workspace.</p>
      </div>

      <!-- Login Form -->
      <form id="form-login" class="auth-form" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@domain.edu.ph" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="btn-login" class="btn btn-primary auth-submit-btn">
          Sign In to Simulator
        </button>
      </form>

      <!-- Footer navigation -->
      <div class="auth-footer">
        <p>Need an account? <a href="register.html" class="auth-link">Register here</a></p>
      </div>

    </div>
  </div>

  <script type="module" src="js/login.js"></script>
  <script type="module" src="js/theme.js"></script>
</body>
</html>
