<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark-theme">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | AIMSER HR Simulator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css?v=8" />
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-topbar">
      <a href="index.html" class="btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">
        <i class="fas fa-arrow-left"></i> Home
      </a>
      <button type="button" id="theme-toggle-btn" class="btn-secondary" style="padding: 0.4rem 0.75rem;" aria-label="Toggle Theme">
        <i class="fas fa-sun"></i>
      </button>
    </div>

    <div class="glass-panel auth-card">
      <div class="auth-header">
        <img src="assets/aimser-logo.png" alt="AIMSER Logo" class="brand-logo" style="width: 48px; height: 48px; margin: 0 auto 0.75rem;" onerror="if(this.src.includes('assets/')){this.src='aimser-logo.png';}else{this.style.display='none';}" />
        <h1>Welcome Back</h1>
        <p class="text-muted">Sign in with your institutional credentials to enter your workspace.</p>
      </div>

      <div id="auth-status-message" class="status-msg" aria-live="polite"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email" class="form-label">Institutional Email</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@institution.edu.ph" required autocomplete="email" />
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label for="login-password" class="form-label" style="margin-bottom: 0;">Password</label>
            <button type="button" id="btn-open-forgot-pw" style="background: none; border: none; color: var(--aimser-blue-400); font-family: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer; padding: 0;">
              Forgot Password?
            </button>
          </div>
          <div class="input-password-wrapper">
            <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" class="btn-toggle-pw" data-target="login-password" aria-label="Toggle password visibility">
              <i class="far fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem; padding: 0.75rem;">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
      </form>

      <div class="auth-footer">
        <span>Don't have an account yet?</span>
        <a href="register.html">Register Here</a>
      </div>
    </div>
  </div>

  <!-- Forgot Password Reset Modal -->
  <div class="modal-backdrop" id="modal-forgot-password" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card" style="max-width: 440px;">
      <div class="modal-header">
        <h3>Reset Account Password</h3>
        <button type="button" class="btn-close-modal" data-close-modal="modal-forgot-password" aria-label="Close modal">&times;</button>
      </div>

      <p class="text-muted" style="font-size: 0.84rem; margin-bottom: 1rem;">
        Enter your registered institutional email address and we will send you a secure password recovery link.
      </p>

      <div id="forgot-status-message" class="status-msg" aria-live="polite"></div>

      <form id="forgot-password-form">
        <div class="form-group">
          <label for="forgot-email" class="form-label">Institutional Email</label>
          <input type="email" id="forgot-email" class="form-control" placeholder="name@institution.edu.ph" required autocomplete="email" />
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" data-close-modal="modal-forgot-password">Cancel</button>
          <button type="submit" id="btn-submit-forgot-pw" class="btn-primary">
            <i class="fas fa-paper-plane"></i> Send Reset Link
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/theme.js?v=8"></script>
  <script type="module" src="js/ui-bridge.js?v=8"></script>
  <script type="module" src="js/auth-guard.js?v=8"></script>
  <script type="module" src="js/auth.js?v=8"></script>
</body>
</html>
