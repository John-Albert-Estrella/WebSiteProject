<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark-theme">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | AIMSER HR Simulator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css?v=18" />
  <style>
    .auth-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--bg-canvas);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: 2rem;
    }
    .auth-brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .auth-brand-header img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      margin-bottom: 0.65rem;
    }
  </style>
</head>
<body>
  <div class="auth-shell">
    <div class="glass-panel auth-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
        <a href="index.html" class="text-muted" style="font-size: 0.8rem; text-decoration: none;">
          <i class="fas fa-arrow-left"></i> Home
        </a>
        <button type="button" id="theme-toggle-btn" class="btn-secondary" style="padding: 0.35rem 0.65rem; font-size: 0.78rem;" title="Toggle Theme">
          <i class="fas fa-sun"></i>
        </button>
      </div>

      <div class="auth-brand-header">
        <img src="assets/aimser-logo.png" alt="AIMSER Logo" onerror="if(this.src.includes('assets/')){this.src='aimser-logo.png';}else{this.style.display='none';}" />
        <h1 style="font-size: 1.45rem; margin: 0;">Sign In to AIMSER</h1>
      </div>

      <div id="login-status" class="status-msg" aria-live="polite"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email" class="form-label">Institutional Email</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@institution.edu.ph" required autocomplete="email" />
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
            <label for="login-password" class="form-label" style="margin: 0;">Password</label>
            <button type="button" id="btn-open-forgot-modal" style="background: none; border: none; color: var(--aimser-blue-400); font-size: 0.78rem; cursor: pointer; padding: 0;">
              Forgot password?
            </button>
          </div>
          <div class="input-password-wrapper">
            <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" class="btn-toggle-pw" data-target="login-password" aria-label="Toggle password visibility">
              <i class="far fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-login-submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem;">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
      </form>

      <div style="margin-top: 1.35rem; padding-top: 1rem; border-top: 1px solid var(--border-subtle); text-align: center; font-size: 0.84rem; color: var(--text-secondary);">
        Don&apos;t have an account?
        <a href="register.html" style="color: var(--aimser-blue-400); font-weight: 600; text-decoration: none;">Create Account</a>
      </div>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal-backdrop" id="modal-forgot-pw" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card" style="max-width: 440px;">
      <div class="modal-header">
        <h3>Reset Account Password</h3>
        <button type="button" class="btn-close-modal" data-close-modal="modal-forgot-pw">&times;</button>
      </div>

      <div id="forgot-pw-status" class="status-msg" aria-live="polite"></div>

      <form id="forgot-pw-form">
        <div class="form-group">
          <label for="forgot-email" class="form-label">Registered Email Address</label>
          <input type="email" id="forgot-email" class="form-control" placeholder="name@institution.edu.ph" required autocomplete="email" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" data-close-modal="modal-forgot-pw">Cancel</button>
          <button type="submit" id="btn-send-reset" class="btn-primary">
            <i class="fas fa-paper-plane"></i> Send Reset Link
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/theme.js?v=18"></script>
  <script type="module" src="js/ui-bridge.js?v=18"></script>
  <script type="module" src="js/auth-guard.js?v=18"></script>
  <script type="module" src="js/auth.js?v=18"></script>
</body>
</html>
