<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aimser - Secure Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

  <div class="login-container">
    <div class="login-brand">
      <h2>Aimser</h2>
      <p>HR Management Simulator</p>
    </div>

    <form class="auth-form" id="loginForm">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" placeholder="name@university.edu" required autocomplete="email">
      </div>
      
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Sign In</button>
    </form>

    <div class="login-footer">
      <p>Need an account? <a href="register.html">Register here</a></p>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
  <script type="module" src="js/auth-guard.js"></script>
</body>
</html>
