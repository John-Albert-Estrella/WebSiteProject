<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark-theme">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Planner | AIMSER HR Simulator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div>
        <div class="sidebar-brand">
          <img src="assets/aimser-logo.png" alt="AIMSER Logo" class="brand-logo" onerror="if(this.src.includes('assets/')){this.src='aimser-logo.png';}else{this.style.display='none';}" />
          <div class="brand-text">
            <h2>AIMSER</h2>
            <span>HR Simulator</span>
          </div>
        </div>

        <nav class="sidebar-nav">
          <div class="nav-section-label">Core Workspace</div>
          <a href="office.html" class="nav-item" id="nav-office">
            <i class="fas fa-building"></i>
            <span>Office</span>
          </a>
          <a href="planner.html" class="nav-item active" id="nav-planner">
            <i class="fas fa-columns"></i>
            <span>Project Planner</span>
          </a>
          <a href="hr-library.html" class="nav-item" id="nav-hr-library">
            <i class="fas fa-book-open"></i>
            <span>HR Library</span>
          </a>

          <div class="nav-section-label">System</div>
          <a href="settings.html" class="nav-item" id="nav-settings">
            <i class="fas fa-cog"></i>
            <span>Settings</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-footer">
        <button type="button" id="theme-toggle-btn" class="btn-sidebar-action theme-toggle">
          <i class="fas fa-sun"></i>
          <span>Toggle Theme</span>
        </button>
        <button type="button" id="logout-btn" class="btn-sidebar-action btn-logout">
          <i class="fas fa-sign-out-alt"></i>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <main class="main-workspace">
      <header class="workspace-header">
        <div class="header-left">
          <h1 class="page-title">Project Planner</h1>
          <select id="planner-team-select" class="form-select" style="max-width: 240px; padding: 0.45rem 0.85rem;">
            <option value="">Loading Teams...</option>
          </select>
          <button type="button" id="btn-open-team-modal" class="btn-secondary" style="padding: 0.45rem 0.85rem; font-size: 0.8125rem;">
            <i class="fas fa-users"></i> New / Join Team
          </button>
          <button type="button" id="btn-open-task-modal" class="btn-primary" style="padding: 0.45rem 0.85rem; font-size: 0.8125rem;">
            <i class="fas fa-plus"></i> Add Task
          </button>
        </div>

        <div class="header-right">
          <div class="user-profile-chip">
            <img id="header-user-avatar" src="https://ui-avatars.com/api/?name=User&background=1b5375&color=faf2dd" alt="Avatar" class="avatar-sm" />
            <div class="user-meta">
              <span id="header-user-name" class="user-name">Loading...</span>
              <span id="header-user-role" class="user-role">Member</span>
            </div>
          </div>
        </div>
      </header>

      <!-- Kanban Board Grid -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.25rem; align-items: start;">
        <section class="glass-panel">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h3 style="font-size: 0.95rem; margin: 0;"><i class="fas fa-circle" style="color: var(--text-tertiary); font-size: 0.6rem; margin-right: 0.4rem;"></i> To Do</h3>
            <span id="count-todo" class="badge-pill">0</span>
          </div>
          <div id="col-todo" style="display: flex; flex-direction: column; gap: 0.75rem; min-height: 220px;"></div>
        </section>

        <section class="glass-panel">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h3 style="font-size: 0.95rem; margin: 0;"><i class="fas fa-circle" style="color: #38bdf8; font-size: 0.6rem; margin-right: 0.4rem;"></i> In Progress</h3>
            <span id="count-inprogress" class="badge-pill">0</span>
          </div>
          <div id="col-inprogress" style="display: flex; flex-direction: column; gap: 0.75rem; min-height: 220px;"></div>
        </section>

        <section class="glass-panel">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h3 style="font-size: 0.95rem; margin: 0;"><i class="fas fa-circle" style="color: var(--warning); font-size: 0.6rem; margin-right: 0.4rem;"></i> Under Review</h3>
            <span id="count-review" class="badge-pill">0</span>
          </div>
          <div id="col-review" style="display: flex; flex-direction: column; gap: 0.75rem; min-height: 220px;"></div>
        </section>

        <section class="glass-panel">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h3 style="font-size: 0.95rem; margin: 0;"><i class="fas fa-circle" style="color: var(--success); font-size: 0.6rem; margin-right: 0.4rem;"></i> Completed</h3>
            <span id="count-done" class="badge-pill">0</span>
          </div>
          <div id="col-done" style="display: flex; flex-direction: column; gap: 0.75rem; min-height: 220px;"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- Modal: Create / Join Team -->
  <div class="modal-backdrop" id="modal-team" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Team Workspace Setup</h3>
        <button type="button" class="btn-close-modal" data-close-modal="modal-team">&times;</button>
      </div>

      <form id="form-create-team" style="margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-subtle);">
        <div class="form-group">
          <label for="new-team-name" class="form-label">Create New HR Project Team</label>
          <input type="text" id="new-team-name" class="form-control" placeholder="e.g., Team Vanguard HR" required />
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">
          <i class="fas fa-plus"></i> Create Team
        </button>
      </form>

      <form id="form-join-team">
        <div class="form-group">
          <label for="join-team-code" class="form-label">Or Join Existing Team via Invite Code</label>
          <input type="text" id="join-team-code" class="form-control" placeholder="e.g., TM-94A2" style="text-transform: uppercase; font-family: var(--font-mono);" required />
        </div>
        <button type="submit" class="btn-secondary" style="width: 100%;">
          <i class="fas fa-sign-in-alt"></i> Join Team
        </button>
      </form>
    </div>
  </div>

  <!-- Modal: Add Task -->
  <div class="modal-backdrop" id="modal-task" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Create Sprint Task</h3>
        <button type="button" class="btn-close-modal" data-close-modal="modal-task">&times;</button>
      </div>

      <form id="form-create-task">
        <div class="form-group">
          <label for="task-title" class="form-label">Task Title</label>
          <input type="text" id="task-title" class="form-control" placeholder="e.g., Draft Employee Handbook Section 2" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="task-priority" class="form-label">Priority</label>
            <select id="task-priority" class="form-select">
              <option value="Normal">Normal</option>
              <option value="High">High</option>
              <option value="Urgent">Urgent</option>
            </select>
          </div>
          <div class="form-group">
            <label for="task-assignee" class="form-label">Assignee</label>
            <input type="text" id="task-assignee" class="form-control" placeholder="Member name" />
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" data-close-modal="modal-task">Cancel</button>
          <button type="submit" class="btn-primary">
            <i class="fas fa-plus"></i> Add to Board
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/ui-bridge.js"></script>
  <script type="module" src="js/auth-guard.js"></script>
  <script type="module" src="js/planner.js"></script>
</body>
</html>
