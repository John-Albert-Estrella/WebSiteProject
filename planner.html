<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Planner | AIMSER HR Simulator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div>
        <div class="sidebar-brand">
          <img src="assets/aimser-logo.png" alt="AIMSER Logo" class="brand-logo" />
          <div class="brand-text">
            <h2>AIMSER</h2>
            <span>HR Simulator</span>
          </div>
        </div>

        <nav class="sidebar-nav">
          <div class="nav-section-label">Core Workspace</div>
          <a href="office.html" class="nav-item" id="nav-office">
            <i class="fas fa-building"></i>
            <span>Office</span>
          </a>
          <a href="planner.html" class="nav-item active" id="nav-planner">
            <i class="fas fa-columns"></i>
            <span>Project Planner</span>
          </a>
          <a href="hr-library.html" class="nav-item" id="nav-hr-library">
            <i class="fas fa-book-open"></i>
            <span>HR Library</span>
          </a>

          <div class="nav-section-label">System</div>
          <a href="settings.html" class="nav-item" id="nav-settings">
            <i class="fas fa-cog"></i>
            <span>Settings</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-footer">
        <button type="button" id="theme-toggle-btn" class="btn-sidebar-action theme-toggle">
          <i class="fas fa-sun"></i>
          <span>Toggle Theme</span>
        </button>
        <button type="button" id="logout-btn" class="btn-sidebar-action btn-logout">
          <i class="fas fa-sign-out-alt"></i>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <main class="main-workspace">
      <header class="workspace-header">
        <div class="header-left">
          <h1 class="page-title">Project Planner</h1>
          <span id="active-team-badge" class="badge-pill">Select or Create a Team</span>
        </div>

        <div class="header-right">
          <div class="team-controls">
            <select id="team-selector" class="form-select" aria-label="Select Project Team">
              <option value="">Select Team Board...</option>
            </select>
            <button type="button" id="btn-create-team-modal" class="btn-primary" data-open="modal-create-team">
              <i class="fas fa-users-cog"></i> New Team
            </button>
            <button type="button" id="btn-join-team-modal" class="btn-secondary" data-open="modal-join-team">
              <i class="fas fa-user-plus"></i> Join Team
            </button>
          </div>

          <div class="user-profile-chip">
            <img id="header-user-avatar" src="https://ui-avatars.com/api/?name=User&background=0284c7&color=fff" alt="Avatar" class="avatar-sm" />
            <div class="user-meta">
              <span id="header-user-name" class="user-name">Authenticated User</span>
              <span id="header-user-role" class="user-role">Member</span>
            </div>
          </div>
        </div>
      </header>

      <div class="planner-toolbar glass-panel">
        <div class="team-info">
          <span id="team-code-display">Team Invite Code: <strong>---</strong></span>
          <span id="team-members-count">
            <i class="fas fa-user-friends"></i> 0 Members
          </span>
        </div>
        <button type="button" id="btn-add-card-modal" class="btn-primary" data-open="modal-add-card">
          <i class="fas fa-plus"></i> Add Task Card
        </button>
      </div>

      <div class="kanban-board" id="planner-kanban-board">
        <div class="kanban-column" data-status="todo">
          <div class="kanban-column-header">
            <h3><i class="fas fa-clipboard-list"></i> To Do</h3>
            <span class="column-count" id="count-todo">0</span>
          </div>
          <div class="kanban-cards-container" id="col-todo"></div>
        </div>

        <div class="kanban-column" data-status="in_progress">
          <div class="kanban-column-header">
            <h3><i class="fas fa-spinner"></i> In Progress</h3>
            <span class="column-count" id="count-in_progress">0</span>
          </div>
          <div class="kanban-cards-container" id="col-in_progress"></div>
        </div>

        <div class="kanban-column" data-status="review">
          <div class="kanban-column-header">
            <h3><i class="fas fa-search"></i> Review</h3>
            <span class="column-count" id="count-review">0</span>
          </div>
          <div class="kanban-cards-container" id="col-review"></div>
        </div>

        <div class="kanban-column" data-status="done">
          <div class="kanban-column-header">
            <h3><i class="fas fa-check-circle"></i> Completed</h3>
            <span class="column-count" id="count-done">0</span>
          </div>
          <div class="kanban-cards-container" id="col-done"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modals (Hidden by Default) -->
  <div id="modal-create-team" class="modal-backdrop" style="display: none;">
    <div class="modal-card glass-panel">
      <div class="modal-header">
        <h3>Create Project Team</h3>
        <button type="button" class="btn-close-modal" data-close="modal-create-team">&times;</button>
      </div>
      <form id="form-create-team">
        <div class="form-group">
          <label for="team-name-input">Team Name</label>
          <input type="text" id="team-name-input" class="form-control" placeholder="e.g., Alpha HR Consultants" required />
        </div>
        <div class="form-group">
          <label for="team-max-members">Max Capacity</label>
          <input type="number" id="team-max-members" class="form-control" value="5" min="2" max="15" required />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" data-close="modal-create-team">Cancel</button>
          <button type="submit" class="btn-primary">Create Team</button>
        </div>
      </form>
    </div>
  </div>

  <div id="modal-join-team" class="modal-backdrop" style="display: none;">
    <div class="modal-card glass-panel">
      <div class="modal-header">
        <h3>Join Project Team</h3>
        <button type="button" class="btn-close-modal" data-close="modal-join-team">&times;</button>
      </div>
      <form id="form-join-team">
        <div class="form-group">
          <label for="team-invite-code">Team Invite Code</label>
          <input type="text" id="team-invite-code" class="form-control" placeholder="Enter invite code" required />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" data-close="modal-join-team">Cancel</button>
          <button type="submit" class="btn-primary">Join Team</button>
        </div>
      </form>
    </div>
  </div>

  <div id="modal-add-card" class="modal-backdrop" style="display: none;">
    <div class="modal-card glass-panel">
      <div class="modal-header">
        <h3>Create Task Card</h3>
        <button type="button" class="btn-close-modal" data-close="modal-add-card">&times;</button>
      </div>
      <form id="form-add-card">
        <div class="form-group">
          <label for="card-title">Task Title</label>
          <input type="text" id="card-title" class="form-control" placeholder="e.g., Draft Employee Handbook Section 4" required />
        </div>
        <div class="form-group">
          <label for="card-desc">Description</label>
          <textarea id="card-desc" class="form-control" rows="3" placeholder="Task notes, subtasks, or links..."></textarea>
        </div>
        <div class="form-group">
          <label for="card-priority">Priority</label>
          <select id="card-priority" class="form-control">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="form-group">
          <label for="card-due">Due Date</label>
          <input type="date" id="card-due" class="form-control" />
        </div>
        <div class="form-group">
          <label for="card-attachment">Attachment (Optional via Cloudinary)</label>
          <input type="file" id="card-attachment" class="form-control" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" data-close="modal-add-card">Cancel</button>
          <button type="submit" class="btn-primary">Save Card</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/ui-bridge.js"></script>
  <script type="module" src="js/auth-guard.js"></script>
  <script type="module" src="js/planner.js"></script>
</body>
</html>
