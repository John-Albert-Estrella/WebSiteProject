<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark-theme">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | AIMSER HR Simulator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">
  <div class="auth-container" style="max-width: 520px;">
    <div class="auth-topbar">
      <a href="index.html" class="btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">
        <i class="fas fa-arrow-left"></i> Home
      </a>
      <button type="button" id="theme-toggle-btn" class="btn-secondary" style="padding: 0.4rem 0.75rem;" aria-label="Toggle Theme">
        <i class="fas fa-sun"></i>
      </button>
    </div>

    <div class="glass-panel auth-card">
      <div class="auth-header">
        <img src="assets/aimser-logo.png" alt="AIMSER Logo" class="brand-logo" style="width: 48px; height: 48px; margin: 0 auto 0.75rem;" onerror="if(this.src.includes('assets/')){this.src='aimser-logo.png';}else{this.style.display='none';}" />
        <h1>Create AIMSER Account</h1>
        <p class="text-muted">Register as a Student or Faculty participant to access the HR Simulator.</p>
      </div>

      <div id="auth-status-message" class="status-msg" aria-live="polite"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="register-fullname" class="form-label">Full Name</label>
          <input type="text" id="register-fullname" class="form-control" placeholder="e.g., Juan Dela Cruz" required autocomplete="name" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="register-email" class="form-label">Institutional Email</label>
            <input type="email" id="register-email" class="form-control" placeholder="name@institution.edu.ph" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="register-role" class="form-label">Account Role</label>
            <select id="register-role" class="form-select" required>
              <option value="student">Student</option>
              <option value="faculty">Faculty</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="register-department" class="form-label">Department / Program / Cohort</label>
          <input type="text" id="register-department" class="form-control" placeholder="e.g., BSBA - Human Resource Management" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="register-password" class="form-label">Password</label>
            <div class="input-password-wrapper">
              <input type="password" id="register-password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required autocomplete="new-password" />
              <button type="button" class="btn-toggle-pw" data-target="register-password" aria-label="Toggle password visibility">
                <i class="far fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="register-confirm-password" class="form-label">Confirm Password</label>
            <div class="input-password-wrapper">
              <input type="password" id="register-confirm-password" class="form-control" placeholder="Re-enter password" minlength="6" required autocomplete="new-password" />
              <button type="button" class="btn-toggle-pw" data-target="register-confirm-password" aria-label="Toggle password visibility">
                <i class="far fa-eye"></i>
              </button>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem; padding: 0.75rem;">
          <i class="fas fa-user-plus"></i> Create Account
        </button>
      </form>

      <div class="auth-footer">
        <span>Already have an account?</span>
        <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/ui-bridge.js"></script>
  <script type="module" src="js/auth-guard.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
