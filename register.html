<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | AIMSER HR Simulator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">
  <div class="auth-wrapper">
    <div class="auth-card glass-panel">
      <div class="auth-brand">
        <img src="assets/aimser-logo.png" alt="AIMSER Logo" class="auth-logo" />
        <h1>Create Simulator Account</h1>
        <p class="text-muted">Join your classroom section or manage HR simulation cohorts.</p>
      </div>

      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label for="reg-fullname">Full Name</label>
          <input 
            type="text" 
            id="reg-fullname" 
            class="form-control" 
            placeholder="Juan Dela Cruz" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="reg-email">Institutional Email</label>
          <input 
            type="email" 
            id="reg-email" 
            class="form-control" 
            placeholder="name@institution.edu.ph" 
            required 
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="reg-role">Account Role</label>
          <select id="reg-role" class="form-control" required>
            <option value="student" selected>Student / Trainee</option>
            <option value="faculty">Faculty / Instructor</option>
          </select>
        </div>

        <div class="form-group">
          <label for="reg-password">Password</label>
          <div class="password-input-box">
            <input 
              type="password" 
              id="reg-password" 
              class="form-control" 
              placeholder="Minimum 6 characters" 
              minlength="6" 
              required 
              autocomplete="new-password"
            />
            <button type="button" class="btn-toggle-pw" id="toggle-reg-pw" aria-label="Toggle password visibility">
              <i class="far fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="reg-submit-btn" class="btn-primary btn-block">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html" class="text-link">Sign in here</a></p>
      </div>
    </div>
  </div>

  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/ui-bridge.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
