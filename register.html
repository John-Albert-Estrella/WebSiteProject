<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aimser - Institutional Registration</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <img src="assets/aimser-logo.png" alt="Aimser Logo" class="brand-img-badge">
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join the institutional Human Resource Management Simulator.</p>
      </div>

      <div id="register-error-box" class="settings-alert-banner danger"></div>

      <form id="form-register" class="auth-form">
        <div class="form-row-duo">
          <div class="form-group">
            <label class="form-label" for="reg-first-name">First Name</label>
            <input type="text" id="reg-first-name" class="form-control" placeholder="e.g. John Albert" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-last-name">Last Name</label>
            <input type="text" id="reg-last-name" class="form-control" placeholder="e.g. Estrella" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Institutional Email</label>
          <input 
            type="email" 
            id="reg-email" 
            class="form-control" 
            placeholder="e.g. user@mseuf.edu.ph" 
            autocomplete="email"
            required
          >
        </div>

        <div class="form-row-duo">
          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <div class="password-input-wrapper">
              <input 
                type="password" 
                id="reg-password" 
                class="form-control" 
                placeholder="Min 6 characters" 
                autocomplete="new-password"
                minlength="6"
                required
              >
              <button type="button" class="btn-toggle-password" data-target="reg-password" title="Toggle password visibility">👁️</button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password</label>
            <div class="password-input-wrapper">
              <input 
                type="password" 
                id="reg-confirm-password" 
                class="form-control" 
                placeholder="Re-enter password" 
                autocomplete="new-password"
                minlength="6"
                required
              >
              <button type="button" class="btn-toggle-password" data-target="reg-confirm-password" title="Toggle password visibility">👁️</button>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary auth-submit-btn" id="btn-submit-register">
          Complete Registration
        </button>
      </form>

      <div class="auth-footer">
        Already registered? <a href="login.html" class="auth-link">Sign in here</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/register.js"></script>
  <script type="module" src="js/theme.js"></script>
</body>
</html>
