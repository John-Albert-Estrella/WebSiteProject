<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aimser - Set New Password</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <img src="assets/aimser-logo.png" alt="Aimser Logo" class="brand-img-badge">
        <h1 class="auth-title">Set New Password</h1>
        <p class="auth-subtitle" id="user-email-target">Enter your new credentials below.</p>
      </div>

      <div id="reset-alert-box" class="settings-alert-banner"></div>

      <form id="form-confirm-password" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="inp-new-password">New Password</label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="inp-new-password" 
              class="form-control" 
              placeholder="Minimum 6 characters" 
              autocomplete="new-password"
              required
              minlength="6"
            >
            <button type="button" class="btn-toggle-password" data-target="inp-new-password" title="Toggle password visibility">👁️</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="inp-confirm-password">Confirm New Password</label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="inp-confirm-password" 
              class="form-control" 
              placeholder="Re-enter password" 
              autocomplete="new-password"
              required
              minlength="6"
            >
            <button type="button" class="btn-toggle-password" data-target="inp-confirm-password" title="Toggle password visibility">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary auth-submit-btn" id="btn-save-password">
          Update Account Password
        </button>
      </form>

      <div class="auth-footer">
        <a href="login.html" class="auth-link">Return to Sign In</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/reset-password.js"></script>
  <script type="module" src="js/theme.js"></script>
</body>
</html>
