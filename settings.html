<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark-theme">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Settings | AIMSER HR Simulator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css?v=18" />
  <link rel="stylesheet" href="css/dashboard.css?v=18" />
</head>
<body>
  <div class="dashboard-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div>
        <div class="sidebar-brand">
          <img src="assets/aimser-logo.png" alt="AIMSER Logo" class="brand-logo" onerror="if(this.src.includes('assets/')){this.src='aimser-logo.png';}else{this.style.display='none';}" />
          <div class="brand-text">
            <h2>AIMSER</h2>
            <span>HR Simulator</span>
          </div>
        </div>

        <nav class="sidebar-nav">
          <div class="nav-section-label">Core Workspace</div>
          <a href="office.html" class="nav-item" id="nav-office">
            <i class="fas fa-building"></i>
            <span>Office</span>
          </a>
          <a href="planner.html" class="nav-item" id="nav-planner">
            <i class="fas fa-columns"></i>
            <span>Project Planner</span>
          </a>
          <a href="hr-library.html" class="nav-item" id="nav-hr-library">
            <i class="fas fa-book-open"></i>
            <span>HR Library</span>
          </a>

          <div class="nav-section-label">System</div>
          <a href="settings.html" class="nav-item active" id="nav-settings">
            <i class="fas fa-cog"></i>
            <span>Settings</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-footer">
        <button type="button" id="theme-toggle-btn" class="btn-sidebar-action theme-toggle">
          <i class="fas fa-sun"></i>
          <span>Toggle Theme</span>
        </button>
        <button type="button" id="logout-btn" class="btn-sidebar-action btn-logout">
          <i class="fas fa-sign-out-alt"></i>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="main-workspace">
      <header class="workspace-header">
        <div class="header-left">
          <h1 class="page-title">Settings</h1>
          <span class="badge-pill">Profile &amp; Security</span>
        </div>

        <div class="header-right">
          <div class="user-profile-chip">
            <img id="header-user-avatar" src="https://ui-avatars.com/api/?name=User&background=1b5375&color=faf2dd" alt="Avatar" class="avatar-sm" />
            <div class="user-meta">
              <span id="header-user-name" class="user-name">Loading...</span>
              <span id="header-user-role" class="user-role">Member</span>
            </div>
          </div>
        </div>
      </header>

      <div class="settings-grid">
        <!-- Profile Card -->
        <section class="settings-card glass-panel">
          <div class="card-header" style="align-items: center;">
            <i class="fas fa-user-circle"></i>
            <div>
              <h3 style="margin: 0;">Personal Identity</h3>
            </div>
          </div>

          <div id="settings-profile-status" class="status-msg" aria-live="polite"></div>

          <form id="settings-profile-form">
            <div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 1.75rem;">
              <img id="settings-avatar-preview" src="https://ui-avatars.com/api/?name=User&background=1b5375&color=faf2dd" alt="Avatar Preview" class="avatar-preview" />
              <div>
                <label for="settings-avatar-input" class="form-label" style="margin-bottom: 0.35rem;">Profile Picture</label>
                <input type="file" id="settings-avatar-input" class="form-control" accept="image/png,image/jpeg,image/webp" style="max-width: 320px;" />
              </div>
            </div>

            <div class="form-group">
              <label for="settings-fullname" class="form-label">Full Name</label>
              <input type="text" id="settings-fullname" class="form-control" placeholder="e.g., Juan Dela Cruz" required />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="settings-email" class="form-label">Institutional Email</label>
                <input type="email" id="settings-email" class="form-control" disabled />
              </div>
              <div class="form-group">
                <label for="settings-role-badge" class="form-label">Account Role</label>
                <input type="text" id="settings-role-badge" class="form-control" disabled />
              </div>
            </div>

            <div class="form-group">
              <label for="settings-department" class="form-label">Department / Program / Cohort</label>
              <input type="text" id="settings-department" class="form-control" placeholder="e.g., BSBA - Human Resource Management" />
            </div>

            <button type="submit" id="btn-save-settings-profile" class="btn-primary" style="margin-top: 0.5rem;">
              <i class="fas fa-save"></i> Save Profile Changes
            </button>
          </form>
        </section>

        <!-- Password Card -->
        <section class="settings-card glass-panel">
          <div class="card-header" style="align-items: center;">
            <i class="fas fa-key"></i>
            <div>
              <h3 style="margin: 0;">Security Credentials</h3>
            </div>
          </div>

          <div id="settings-password-status" class="status-msg" aria-live="polite"></div>

          <form id="settings-password-form">
            <div class="form-group">
              <label for="settings-current-pw" class="form-label">Current Password</label>
              <div class="input-password-wrapper">
                <input type="password" id="settings-current-pw" class="form-control" placeholder="Enter current password" required autocomplete="current-password" />
                <button type="button" class="btn-toggle-pw" data-target="settings-current-pw" aria-label="Toggle password visibility">
                  <i class="far fa-eye"></i>
                </button>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="settings-new-pw" class="form-label">New Password</label>
                <div class="input-password-wrapper">
                  <input type="password" id="settings-new-pw" class="form-control" placeholder="Minimum 6 characters" minlength="6" required autocomplete="new-password" />
                  <button type="button" class="btn-toggle-pw" data-target="settings-new-pw" aria-label="Toggle password visibility">
                    <i class="far fa-eye"></i>
                  </button>
                </div>
              </div>
              <div class="form-group">
                <label for="settings-confirm-pw" class="form-label">Confirm New Password</label>
                <div class="input-password-wrapper">
                  <input type="password" id="settings-confirm-pw" class="form-control" placeholder="Re-enter new password" minlength="6" required autocomplete="new-password" />
                  <button type="button" class="btn-toggle-pw" data-target="settings-confirm-pw" aria-label="Toggle password visibility">
                    <i class="far fa-eye"></i>
                  </button>
                </div>
              </div>
            </div>

            <button type="submit" id="btn-save-settings-pw" class="btn-primary" style="margin-top: 0.5rem;">
              <i class="fas fa-lock"></i> Update Password
            </button>
          </form>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="js/theme.js?v=18"></script>
  <script type="module" src="js/ui-bridge.js?v=18"></script>
  <script type="module" src="js/auth-guard.js?v=18"></script>
  <script type="module" src="js/settings.js?v=18"></script>
</body>
</html>
